[project]
name = "myplotter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4", "PySide6>=6.8,<7", "svgelements>=1.9.6,<2"]

[project.scripts]
myplotter = "myplotter.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
